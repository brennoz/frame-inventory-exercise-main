services:
  backend:
    build:
      context: ./src/backend
    container_name: frame-inventory-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-primary:3306/frames
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - frame-inventory

  frontend:
    build:
      context: ./src/frontend
    container_name: frame-inventory-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_BACKEND_URL: http://backend:8080
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/public:/app/public
      - ./src/frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frame-inventory

  mariadb-primary:
    image: mariadb:11.4
    container_name: frame-inventory-mariadb-primary
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: frames
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    volumes:
      - mariadb-primary-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - frame-inventory

volumes:
  mariadb-primary-data:

networks:
  frame-inventory:
    driver: bridge
